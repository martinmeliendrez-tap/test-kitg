<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>KITG Summer Camps Central (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: operations console. Left rail of sections, header with camp + role scope, content as scannable panels. Brand orange as the one loud color. */
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --sunk:#E9EBF2; --ink:#141A2E; --muted:#5A6079; --line:#DADDE7;
  --accent:#FF8800; --accent-ink:#1B1204; --accent-soft:#FFE9D1; --blue:#1F55E6; --blue-soft:#E3EAFF;
  --good:#17854B; --good-soft:#DDF3E6; --warn:#A96A00; --warn-soft:#FFF1CC; --crit:#C8322E; --crit-soft:#FDE2E0;
  --heat0:#FFF6EC; --heat1:#FFD9AE; --heat2:#FFB566; --heat3:#FF8800;
  --f-display:"Grandstander","Comic Sans MS","Trebuchet MS",sans-serif;
  --f-body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Poppins",system-ui,sans-serif;
  --f-num:"Poppins",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1120; --surface:#171B2D; --sunk:#1F2438; --ink:#ECEEF6; --muted:#9AA0B9; --line:#2B3049;
  --accent:#FF9A2E; --accent-ink:#1B1204; --accent-soft:#3A2710; --blue:#7C9BFF; --blue-soft:#1E2748;
  --good:#4CC784; --good-soft:#15301F; --warn:#F2B53A; --warn-soft:#352A0F; --crit:#FF6B63; --crit-soft:#3B1817;
  --heat0:#221E1D; --heat1:#4A3218; --heat2:#8A5317; --heat3:#FF9A2E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#171B2D; --sunk:#1F2438; --ink:#ECEEF6; --muted:#9AA0B9; --line:#2B3049;
  --accent:#FF9A2E; --accent-ink:#1B1204; --accent-soft:#3A2710; --blue:#7C9BFF; --blue-soft:#1E2748;
  --good:#4CC784; --good-soft:#15301F; --warn:#F2B53A; --warn-soft:#352A0F; --crit:#FF6B63; --crit-soft:#3B1817;
  --heat0:#221E1D; --heat1:#4A3218; --heat2:#8A5317; --heat3:#FF9A2E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* sample banner */
.sample{background:var(--ink);color:var(--bg);font-size:12px;padding:6px 16px;text-align:center}

/* header */
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:34px;height:34px;display:grid;grid-template-columns:1fr 1fr;gap:3px}
.mark i{display:block;border-radius:3px;background:var(--accent)}
.mark i:nth-child(2){background:var(--blue)}.mark i:nth-child(3){background:var(--ink)}.mark i:nth-child(4){background:var(--accent);opacity:.45}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:.01em;line-height:1}
.brand small{display:block;color:var(--muted);font-size:12px}
.scope{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.scope label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.scope select{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;text-transform:none;letter-spacing:0;font-weight:600;max-width:100%}
#roleSel{border-color:var(--blue);background:var(--blue-soft)}

/* shell */
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 100px)}
nav.rail{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
nav.rail button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;font-weight:600;color:var(--muted)}
nav.rail button:hover{background:var(--sunk);color:var(--ink)}
nav.rail button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav.rail .count{font-size:11px;background:var(--crit);color:#fff;border-radius:99px;padding:1px 7px}
.hiddenNote{margin-top:12px;padding:10px 12px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line)}
.sources{margin-top:auto;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.src{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.src span:last-child{margin-left:auto;font-family:var(--f-mono);font-size:10.5px}

main{padding-block:20px 48px;padding-inline:24px;min-width:0;display:flex;flex-direction:column;gap:18px}
.pagehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px}
.pagehead h1{font-family:var(--f-display);font-size:26px;line-height:1.1;font-weight:400}
.pagehead p{margin:4px 0 0;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.panel h2 .sub{font-weight:500;color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}

/* dates strip */
.dates{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-top:12px}
.date{flex:0 0 196px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;background:var(--surface)}
.date .cal{flex:none;width:42px;text-align:center;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.date .cal b{display:block;background:var(--accent);color:var(--accent-ink);font-size:10px;letter-spacing:.08em;padding:2px 0}
.date .cal span{display:block;font-family:var(--f-display);font-size:18px;padding:2px 0}
.date .what{font-weight:700;font-size:13px;line-height:1.25}
.date .where{font-size:12px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;white-space:nowrap;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 6px;margin-bottom:4px}
.tag.oh{background:var(--accent-soft);color:var(--ink)}
.tag.dl{background:var(--crit-soft);color:var(--crit)}
.tag.st{background:var(--blue-soft);color:var(--blue)}
.tag.cp{background:var(--good-soft);color:var(--good)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:28px;line-height:1.1}
.kpi .v small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:600}
.kpi .d{font-size:12.5px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good i{background:var(--good)}.bar.warn i{background:var(--warn)}.bar.crit i{background:var(--crit)}.bar.blue i{background:var(--blue)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.blue{background:var(--blue-soft);color:var(--blue)}

/* tables */
.tw{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sunk)}
td.num,th.num{text-align:right}
.campname{font-weight:700}.region{font-size:11.5px;color:var(--muted)}
.mini{display:flex;align-items:center;gap:8px;min-width:120px}.check .mini{min-width:0}.mini .bar{flex:1}.mini span{font-size:12px;width:34px;text-align:right}

/* heatmap */
.heat td.h{text-align:center;font-size:12px;border:2px solid var(--surface);border-radius:4px;min-width:62px;color:var(--ink)}
.heat td.h b{display:block;font-size:13px}
.heat td.h small{color:inherit;opacity:.75}
.h0{background:var(--heat0)}.h1{background:var(--heat1)}.h2{background:var(--heat2)}.h3{background:var(--heat3);color:var(--accent-ink)!important}
.wl{display:inline-block;background:var(--ink);color:var(--bg);font-size:10px;border-radius:3px;padding:0 4px;margin-top:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center;margin-top:10px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.alert{display:grid;grid-template-columns:4px minmax(0,1fr);gap:12px;padding:10px 12px 10px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.alert .sev{background:var(--warn)}.alert.crit .sev{background:var(--crit)}.alert.info .sev{background:var(--blue)}.alert.good .sev{background:var(--good)}
.alert p{margin:0 0 8px;font-size:13px}
.alert .meta{font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 10px;font-size:12.5px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.done{background:var(--good-soft);color:var(--good);border-color:transparent;cursor:default}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}

/* chart */
.chart{margin-top:8px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}

/* checklist */
.check{display:grid;grid-template-columns:minmax(0,1fr) 150px 84px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check .n{font-weight:600}.check .s{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;background:var(--sunk);border-radius:4px;padding:1px 6px}
.locked{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:2px 8px}

/* groups */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:12px}
.grp{border:1px solid var(--line);border-radius:9px;padding:12px}
.grp .gn{font-weight:700}.grp .gs{font-size:12px;color:var(--muted);margin:2px 0 8px}
.dots{display:flex;flex-wrap:wrap;gap:3px}
.dots i{width:9px;height:9px;border-radius:2px;background:var(--accent)}
.dots i.o{background:var(--sunk)}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.fstep{display:grid;grid-template-columns:150px minmax(0,1fr) 60px;gap:10px;align-items:center}
.fstep .fl{font-weight:600;font-size:13px}.fstep .fl small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.fstep .fb{height:22px;border-radius:5px;background:var(--sunk);overflow:hidden}
.fstep .fb i{display:block;height:100%;background:var(--blue)}
.fstep .fv{text-align:right;font-weight:700}

/* agent */
.chat{display:flex;flex-direction:column;gap:12px;margin-top:12px;max-height:520px;overflow-y:auto;padding-right:4px}
.msg{max-width:88%;padding:10px 13px;border-radius:12px;font-size:13.5px}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:3px}
.msg.bot{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:3px}
.msg.bot ul{margin:6px 0 0;padding-left:18px}
.who{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.asks{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ask{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600}
.ask:hover{border-color:var(--accent)}
.askform{display:flex;gap:8px;margin-top:10px}
.askform input{flex:1;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 10px}
.log{display:flex;flex-direction:column;margin-top:8px}
.log div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.log time{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:2px}

/* access */
.yes{color:var(--good);font-weight:700}.no{color:var(--muted)}
.camphead{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
.camphead b{color:var(--ink)}
.linkish{background:none;border:0;padding:0;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
.idea{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.idea div{border:1px dashed var(--line);border-radius:9px;padding:12px;font-size:13px}
.idea b{display:block;margin-bottom:3px}

.avatar{width:56px;height:56px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;flex:none}
.phead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.phead h1{font-family:var(--f-display);font-size:26px;font-weight:400;line-height:1.1}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--surface)}
.badge.uc{border-color:var(--accent);background:var(--accent-soft)}
.badge.bh{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:12px}
.wkt{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px}
.wkt b{display:block;font-size:13px}
.wkt.on{background:var(--accent-soft);border-color:var(--accent)}
.wkt.off{color:var(--muted);background:var(--sunk);border-style:dashed}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:7px 12px;margin-top:12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.tl{display:flex;flex-direction:column;gap:8px;margin-top:10px;font-size:13px}
.tl div{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px}
.tl time{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:2px}
.todo-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.todo-row:last-child{border-bottom:0}
.ok{color:var(--good);font-weight:700}.miss{color:var(--crit);font-weight:700}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.toolbar input[type=search],.toolbar select{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 10px;min-width:0}
.toolbar input[type=search]{flex:1 1 200px}
.bands{display:flex;gap:6px;flex-wrap:wrap}
.band{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600}
.band[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.band span{opacity:.65;margin-left:4px}
th button.sort{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button.sort:focus-visible{outline:2px solid var(--blue)}
th button.sort.on{color:var(--ink)}
td select.gsel{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:3px 6px;font-size:12.5px;max-width:140px}
.dy{display:inline-grid;place-items:center;width:26px;height:22px;border-radius:4px;font-size:10.5px;font-weight:700;background:var(--sunk);color:var(--muted);margin-right:2px}
.dy.on{background:var(--accent);color:var(--accent-ink)}.dy.on.bhd{background:var(--blue);color:var(--surface)}.dy.x{background:none;text-decoration:line-through}
.daycards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}
.dayc{border:1px solid var(--line);border-radius:9px;padding:10px;text-align:left;background:var(--surface)}
.dayc[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dayc .dn{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dayc .dv{font-family:var(--f-display);font-size:24px;line-height:1.1}
.dayc .ds{font-size:11.5px;color:var(--muted)}
.split{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--sunk);margin-top:6px}.split i{display:block;height:100%}
td.wkc{text-align:center;font-size:11.5px;white-space:nowrap}
.ucdot{color:var(--accent);font-weight:700}.bhdays{color:var(--blue);font-weight:700}
@media (max-width:640px){.daycards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.grp{text-align:left;background:var(--surface);color:var(--ink);font:inherit}
button.grp:hover{border-color:var(--accent)}
.grp .open{font-size:12px;font-weight:700;color:var(--blue);margin-top:8px}
.sheet td{vertical-align:top}.sheet td:nth-child(3),.sheet td:nth-child(5){white-space:nowrap}
.sheet .med{color:var(--crit);font-weight:700}
.lg{display:inline-block;min-width:22px;text-align:center;border-radius:4px;font-weight:700;font-size:12px;padding:1px 6px}
.lg.a{background:var(--blue-soft);color:var(--blue)}.lg.b{background:var(--accent-soft);color:var(--ink)}
.sheetmeta{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--muted);margin-top:8px}.sheetmeta b{color:var(--ink)}
.confid{font-size:12px;color:var(--crit);font-weight:600}
@media print{.sample,header.top,nav.rail,.noprint,.toast{display:none!important}.shell{display:block}main{padding:0}.panel{border:0;padding:0}body{background:#fff;color:#000}}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.slot{margin-top:4px}
.slothead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.slothead b{font-family:var(--f-display);font-weight:400;font-size:18px}

function scoped(){const r=ROLES[S.role];const ids=S.camp==='all'?r.camps:[S.camp];return CAMPS.filter(c=>ids.includes(c.id))}
function isMulti(){return S.camp==='all'&&ROLES[S.role].camps.length>1}
function scopeLabel(){const r=ROLES[S.role];if(!isMulti())return campById(S.camp==='all'?r.camps[0]:S.camp).name;return S.role==='reg'?'All Brooklyn camps':'All 13 camps'}
function sev(p,good,warn){return p>=good?'good':p>=warn?'warn':'crit'}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function sum(arr,f){return arr.reduce((a,c)=>a+f(c),0)}

// ---------- alerts (agent findings) ----------
function alerts(){
  const cs=scoped(),out=[],r=ROLES[S.role];
  const canTodo=r.tabs.includes('todo'),canStaff=r.tabs.includes('staff'),canReg=r.tabs.includes('reg'),canSwim=r.tabs.includes('swim');
  if(canTodo){const c=[...cs].sort((a,b)=>a.todo.health-b.todo.health)[0];const miss=Math.round(c.campers*(1-c.todo.health));
    out.push({id:'phys-'+c.id,sev:c.todo.health<.7?'crit':'warn',meta:'UltraCamp · forms',text:`${c.name}: ${miss} campers still have the "Submit Health Form" task open, and forms are due May 15. The agent can text or email these families and give ${c.dir} a follow-up list.`,act:'Text or email families + Asana task',owner:c.dir});}
  if(canStaff){const c=[...cs].sort((a,b)=>a.hired/a.staffNeed-b.hired/b.staffNeed)[0];const gap=c.staffNeed-c.hired;
    out.push({id:'staff-'+c.id,sev:c.hired/c.staffNeed<.7?'crit':'warn',meta:'Workable + Paycom · staffing',text:`${c.name} is ${gap} staff short of what peak week (${WEEKS[c.reg.indexOf(Math.max(...c.reg))]}) needs. ${Math.round(c.applied*.2)} applicants in Workable haven't been reviewed yet.`,act:'Create Asana task for HR',owner:'HR team'});}
  if(canReg){const w=cs.filter(c=>c.wl.some(x=>x>0));if(w.length){const tot=sum(w,c=>c.wl.reduce((a,b)=>a+b,0));
    out.push({id:'wl',sev:'info',meta:'UltraCamp · registration',text:`${w.length} camp${w.length>1?'s have':' has'} waitlists (${tot} camper-weeks total), led by ${w.sort((a,b)=>b.wl.reduce((x,y)=>x+y,0)-a.wl.reduce((x,y)=>x+y,0))[0].name}. Worth checking whether another group can open.`,act:'Flag for ops meeting',owner:'Ops'})}}
  if(canSwim){const low=cs.filter(c=>c.swimLess<c.swimBE);if(low.length)out.push({id:'swim',sev:'warn',meta:'UltraCamp · swim add-on',text:`Swim lesson sign-ups are below break-even at ${low.length} camp${low.length>1?'s':''} (${low.slice(0,3).map(c=>c.name).join(', ')}${low.length>3?'…':''}). A targeted parent email could close the gap before the vendor deadline.`,act:'Draft parent email',owner:'Marketing'})}
  const next=DATES.find(d=>d.t==='oh'&&(d.where==='all'||d.where.some(id=>cs.some(c=>c.id===id))));
  if(next)out.push({id:'oh',sev:'good',meta:'Calendar · open houses',text:`Next open house: ${fmtDate(next.d)} at ${next.where.map(id=>campById(id).name).filter(n=>cs.some(c=>c.name===n)).join(' & ')}. The prep checklist is already in Asana.`,done:true});
  return out;
}
function fmtDate(d,short){const x=new Date(d+'T12:00');return x.toLocaleDateString('en-US',short?{month:'short',day:'numeric'}:{weekday:'short',month:'short',day:'numeric'})}

function alertHTML(a){const done=S.done[a.id]||a.done;
  return `<div class="alert ${a.sev==='crit'?'crit':a.sev==='info'?'info':a.sev==='good'?'good':''}"><div class="sev"></div><div><span class="meta">${a.meta}</span><p>${a.text}</p>
  ${a.act||done?`<div class="btnrow">${done?`<span class="btn done">✓ ${a.done?'Handled by agent':'Task created in Asana · '+esc(a.owner)}</span>`:`<button class="btn primary" data-act="${a.id}" data-owner="${esc(a.owner)}">${a.act}</button><button class="btn" data-dismiss="${a.id}">Dismiss</button>`}</div>`:''}</div></div>`}

function dateCard(d){const x=new Date(d.d+'T12:00');const where=d.where==='all'?'All camps':d.where.map(id=>campById(id).name).join(' · ');
  return `<div class="date"><div class="cal"><b>${x.toLocaleDateString('en-US',{month:'short'}).toUpperCase()}</b><span>${x.getDate()}</span></div><div><span class="tag ${d.t}">${TAGN[d.t]}</span><div class="what">${d.w}</div><div class="where">${where}</div></div></div>`}
function mini(p,cls){return `<div class="mini"><div class="bar ${cls}"><i style="width:${Math.min(100,pct(p))}%"></i></div><span>${pct(p)}%</span></div>`}

function weekChart(cs){
  const W=560,Hh=230,pl=38,pb=34,pt=12,pr=8;
  const reg=WEEKS.map((_,i)=>sum(cs,c=>c.reg[i])),cap=WEEKS.map((_,i)=>sum(cs,c=>i<c.nw?c.cap:0)),wl=WEEKS.map((_,i)=>sum(cs,c=>c.wl[i]));
  const maxV=Math.max(...cap.map((c,i)=>Math.max(c,reg[i]+wl[i])));
  const step=niceStep(maxV/4),top=Math.ceil(maxV/step)*step;
  const y=v=>pt+(Hh-pt-pb)*(1-v/top),bw=(W-pl-pr)/WEEKS.length;
  let g='';
  for(let v=0;v<=top;v+=step)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`;
  WEEKS.forEach((w,i)=>{const x=pl+i*bw+bw*.18,bwid=bw*.64;
    g+=`<rect x="${x}" y="${y(cap[i])}" width="${bwid}" height="${y(0)-y(cap[i])}" fill="var(--sunk)" rx="3"><title>Week ${i+1} capacity ${cap[i]}</title></rect>`;
    g+=`<rect x="${x}" y="${y(reg[i])}" width="${bwid}" height="${y(0)-y(reg[i])}" fill="var(--accent)" rx="3"><title>Week ${i+1}: ${reg[i]} registered of ${cap[i]}</title></rect>`;
    if(wl[i])g+=`<rect x="${x}" y="${y(reg[i]+wl[i])}" width="${bwid}" height="${y(reg[i])-y(reg[i]+wl[i])}" fill="var(--ink)" rx="2"><title>Week ${i+1}: ${wl[i]} on waitlist</title></rect>`;
    g+=`<text x="${x+bwid/2}" y="${Hh-18}" text-anchor="middle" style="font-weight:600;fill:var(--ink)">Wk ${i+1}</text><text x="${x+bwid/2}" y="${Hh-5}" text-anchor="middle">${w}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Registered campers per week against capacity">${g}</svg></div>
  <div class="legend"><span><i style="background:var(--accent)"></i>Registered</span><span><i style="background:var(--sunk);border:1px solid var(--line)"></i>Open spots</span><span><i style="background:var(--ink)"></i>Waitlist</span></div>`;
}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x)));const n=x/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}

  ${staffWeekPanel(c,wk,g)}
  <section class="panel"><h2>Swim groups this week <span class="sub">From self-reported level, updated after the Day 1 swim test</span></h2><div class="funnel">${LEVELS.map((l,i)=>`<div class="fstep"><div class="fl">${l}</div><div class="fb"><i style="width:${pct(c.levels[i]/Math.max(...c.levels))}%"></i></div><div class="fv">${Math.round(c.levels[i]*c.reg[wk]/c.campers)}</div></div>`).join('')}</div></section>`;

function groupNames(g){return g.flatMap(x=>[...Array(x.groups)].map((_,i)=>x.team+(x.groups>1?' '+String.fromCharCode(65+i):'')))}
function staffWeekPanel(c,w,g){
  const names=groupNames(g);const need=sum(g,x=>x.couns);
  const order=['Camp Director','Assistant Director','Division Leader','Nurse','Lifeguard','Art Specialist','STEM Specialist','Sports Specialist','Movement Specialist','Early Childhood Specialist','Behavioral Intervention Specialist','Counselor','CIT','SYEP'];
  const staff=STAFF.filter(x=>x.camp===c.id).sort((a,b)=>order.indexOf(a.role)-order.indexOf(b.role)||(a.last+a.first).localeCompare(b.last+b.first));
  const working=staff.filter(x=>staffAvail(x,w).state!=='off');
  const couns=working.filter(x=>/Counselor/.test(x.role));
  const days=[0,1,2,3,4].map(d=>(CLOSED[w]||[]).includes(d)?null:couns.filter(x=>{const a=staffAvail(x,w);return a.state==='all'||(a.state==='partial'&&!a.out.some(o=>o.d===d))}).length);
  const assigned=couns.filter(x=>S.cAssign[x.id+'-'+w]).length;

  <div class="daycards">${days.map((n,d)=>n===null?`<div class="dayc" style="background:var(--sunk)"><div class="dn">${DL[d]}</div><div class="dv">Closed</div></div>`:`<div class="dayc"><div class="dn">${dShort(w,d)}</div><div class="dv" style="color:${n<need?'var(--crit)':'var(--ink)'}">${n}<span style="font-size:13px;color:var(--muted)"> / ${need}</span></div><div class="ds">${n<need?(need-n)+' short':'Covered'}</div></div>`).join('')}</div>

  <div class="tw"><table><thead><tr><th>Name</th><th>Role</th><th>This week</th><th>Group</th></tr></thead><tbody>
  ${staff.map(x=>{const a=staffAvail(x,w);const canG=/Counselor/.test(x.role)&&a.state!=='off'&&a.state!=='out';return `<tr ${a.state==='off'?'style="opacity:.55"':''}><td><button class="linkish" data-staff="${x.id}">${x.first} ${x.last}</button></td><td>${x.role}</td><td>${availTxt(x,w)}</td><td>${canG?`<select class="gsel" data-cassign="${x.id}-${w}" aria-label="Group for ${x.first}"><option value="">Unassigned</option>${names.map(n=>`<option ${S.cAssign[x.id+'-'+w]===n?'selected':''}>${n}</option>`).join('')}</select>`:`<span class="muted" style="font-size:12.5px">${/Specialist/.test(x.role)?'Rotates to all groups':/Counselor/.test(x.role)?'—':'Camp-wide'}</span>`}</td></tr>`}).join('')}
  </tbody></table></div></section>`;
}
function groupsFor(c,wk){return GRADES.map(([grade,team,size],i)=>{const n=c.list.filter(k=>k.weeks[wk]&&gi(k)===i).length;const groups=Math.max(1,Math.ceil(n/size));return {grade,team,size,n,groups,couns:groups}})}

function viewTodo(){
  const cs=scoped(),r=ROLES[S.role],multi=isMulti();
  const maxW=Math.max(...cs.map(c=>c.nw));if(S.tWeek!=='all'&&S.tWeek>=maxW)S.tWeek='all';
  const all=cs.flatMap(c=>c.list);
  const base=S.tWeek==='all'?all:all.filter(k=>k.weeks[S.tWeek]);
  const first=k=>k.weeks.indexOf(true);
  let fams=base.map(k=>({k,miss:openTodos(k)})).filter(x=>x.miss.length);
  fams.sort(S.tSort==='week'?(a,b)=>first(a.k)-first(b.k)||b.miss.length-a.miss.length:(a,b)=>b.miss.length-a.miss.length||first(a.k)-first(b.k));

  const views=[['model','Staffing model'],['weekly','Weekly rosters'],...(['lead','hr','reg'].includes(S.role)?[['pay','Payroll budget']]:[]),['checklist','Documents &amp; Trainings'],['contacts','Contacts'],['gear','Gear sizes']];
  const canSet=['lead','hr'].includes(S.role);if(!views.some(v=>v[0]===S.staffView)&&!(S.staffView==='ssettings'&&canSet))S.staffView='model';
  const seg=`<div class="seg" role="group" aria-label="Staff views" style="flex-wrap:wrap">${views.map(([k,l])=>`<button data-staffview="${k}" aria-pressed="${S.staffView===k}">${l}</button>`).join('')}</div>`+(canSet?`<button class="btn" data-staffview="ssettings" style="margin-left:8px" aria-pressed="${S.staffView==='ssettings'}">Settings & automations</button>`:'');
  const all=staffScope();
  const head=(eb,h,p)=>`<div class="pagehead"><div><div class="eyebrow">${eb}</div><h1>${h}</h1><p>${p}</p></div></div><div>${seg}</div>`;
  if(S.staffView==='model')return staffModel(seg,head);
  if(S.staffView==='weekly')return staffWeekly(seg,head);
  if(S.staffView==='contacts')return staffContacts(seg,head);
  if(S.staffView==='pay')return staffPayView(seg,head);
  if(S.staffView==='ssettings')return staffSettingsView(seg,head);
  if(S.staffView==='directory'){
    const rows=staffSortRows(staffFilter(all));const multi=isMulti();
    return head('Staff · Asana onboarding board + Paycom + TalentLMS','Staff directory',`${scopeLabel()} · ${all.length} confirmed staff. Sort by camp, role or missing items. Tap a person for their full profile.`)+`
    <section class="panel">${staffToolbar()}<div class="tw"><table><thead><tr>${sth('name','Name')}${multi?sth('camp','Camp'):''}${sth('role','Role')}<th>Weeks</th><th>Documents owed</th><th>TalentLMS courses</th>${sth('off','Days off requested')}<th>Gear</th></tr></thead><tbody>
    ${rows.map(x=>`<tr class="click" data-staff="${x.id}"><td><div class="campname">${x.first} ${x.last}</div><div class="region">${x.returning?'Returning':'New'} · ${x.email}</div></td>${multi?`<td>${campById(x.camp).name}</td>`:''}<td>${x.role}${x.level?' · L'+x.level:''}</td><td class="muted">${wkRange(x)}</td><td>${missChips(x,'paycom')}</td><td>${missChips(x,'talent')}</td><td>${x.off.length?x.off.map(o=>{const st2=S.offStatus[x.id+o.w]||o.status;return `<div style="font-size:12.5px;white-space:nowrap;margin:2px 0"><b>${offTxt(o)}</b> <span class="pill ${st2==='Approved'?'good':st2==='Pending'?'warn':'crit'}" style="font-size:10.5px">${st2}</span></div>`}).join(''):'<span class="muted">None</span>'}</td><td>${sizeTxt(x)}</td></tr>`).join('')}
    </tbody></table></div><p class="muted" style="font-size:12.5px;margin:10px 0 0">${rows.length} of ${all.length} staff shown.</p></section>`;
  }
  if(S.staffView==='gear'){
    const rows=staffSortRows(staffFilter(all));const items=[['shirt','Shirt',TSIZE],['shorts','Shorts',SSIZE]];const noG=all.filter(x=>!gearOk(x));
    return head('Staff · gear sizes','Gear sizes',`${scopeLabel()} · totals for ordering, plus each person's sizes.`)+`
    <section class="panel"><h2>Order totals <span class="sub">${all.length-noG.length} of ${all.length} staff have sent both sizes</span></h2><div class="sizes">${items.map(([k,l,sz])=>`<div class="sizebox"><div class="eyebrow">${l}</div>${sz.map(z=>{const n=all.filter(x=>x.gear[k]===z).length;return n?`<div class="row"><span>${z}</span><b>${n}</b></div>`:''}).join('')}<div class="row"><span style="color:var(--crit)">Missing</span><b style="color:var(--crit)">${all.filter(x=>!x.gear[k]).length}</b></div></div>`).join('')}<div class="sizebox"><div class="eyebrow">Still missing</div><div style="font-family:var(--f-num);font-weight:700;font-size:28px;margin-top:4px">${noG.length}</div><p class="muted" style="font-size:12.5px;margin:4px 0 8px">staff are missing a shirt or shorts size</p>${noG.length?`<button class="btn primary" data-emailgroup="gear">Remind them (text or email)</button>`:''}</div></div>
    <div class="btnrow" style="margin-top:12px"><button class="btn" data-gearcsv="1">Download order list (CSV)</button></div></section>
    <section class="panel">${staffToolbar()}<div class="tw"><table><thead><tr>${sth('name','Name')}${isMulti()?sth('camp','Camp'):''}${sth('role','Role')}<th>Shirt size</th><th>Shirt cut</th><th>Shorts size</th><th>Shorts cut</th></tr></thead><tbody>${rows.map(x=>`<tr class="click" data-staff="${x.id}"><td class="campname">${x.first} ${x.last}</td>${isMulti()?`<td>${campById(x.camp).name}</td>`:''}<td>${x.role}</td><td>${sizeCell(x.gear.shirt)}</td><td class="muted">${x.gear.shirtCut||'—'}</td><td>${sizeCell(x.gear.shorts)}</td><td class="muted">${x.gear.shortsCut||'—'}</td></tr>`).join('')}</tbody></table></div></section>`;
  }
  if(S.staffView==='timeoff'){
    const reqs=staffFilter(all).flatMap(x=>x.off.map(o=>({x,o,st:S.offStatus[x.id+o.w]||o.status}))).sort((a,b)=>a.o.w-b.o.w||a.o.days[0]-b.o.days[0]);
    const maxW=Math.max(...scoped().map(c=>c.nw));
    const grid=[...Array(maxW)].map((_,w)=>[0,1,2,3,4].map(d=>reqs.filter(r=>r.st!=='Denied'&&r.o.w===w&&r.o.days.includes(d)).length));
    const mx=Math.max(1,...grid.flat());
    return head('Staff · time off requests','Time off',`${scopeLabel()} · ${reqs.length} requests, ${reqs.filter(r=>r.st==='Pending').length} waiting for a decision.`)+`
    <section class="panel"><h2>Staff out by day <span class="sub">Approved and pending requests · darker means more people out</span></h2><div class="tw"><table class="heat"><thead><tr><th>Week</th>${DL.map(d=>`<th style="text-align:center">${d}</th>`).join('')}</tr></thead><tbody>${grid.map((r,w)=>`<tr><td class="campname">${wkLbl(w)}</td>${r.map((n,d)=>(CLOSED[w]||[]).includes(d)?'<td class="h" style="background:var(--sunk);color:var(--muted)">Closed</td>':`<td class="h ${n===0?'h0':n/mx<.34?'h1':n/mx<.67?'h2':'h3'}"><b>${n}</b></td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
    <section class="panel"><h2>Requests</h2>${staffToolbar()}<div class="tw"><table><thead><tr><th>Name</th>${isMulti()?'<th>Camp</th>':''}<th>Role</th><th>Dates</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>
    ${reqs.map(({x,o,st})=>`<tr><td><button class="linkish" data-staff="${x.id}">${x.first} ${x.last}</button></td>${isMulti()?`<td>${campById(x.camp).name}</td>`:''}<td>${x.role}</td><td>${offTxt(o)} <span class="muted">(Week ${o.w+1})</span></td><td class="muted">${o.reason}</td><td><span class="pill ${st==='Approved'?'good':st==='Pending'?'warn':'crit'}">${st}</span></td><td>${st==='Pending'?`<div class="btnrow"><button class="btn" data-offset="${x.id+'|'+o.w+'|Approved'}">Approve</button><button class="btn" data-offset="${x.id+'|'+o.w+'|Denied'}">Deny</button></div>`:''}</td></tr>`).join('')}
    </tbody></table></div></section>`;
  }
  // checklist
  const rows=staffSortRows(staffFilter(all));const missAll=all.filter(x=>staffMissing(x).length);
  const cols=[...PW,...TR,{k:'gear',sh:'Sizes',n:'Gear sizes'}];
  const mk=(x,t)=>{if(t.k==='gear')return gearOk(x)?'<span class="mk y">✓</span>':'<span class="mk n">✗</span>';const v=x.items[t.k];return v===null?'<span class="mk na">–</span>':v?'<span class="mk y">✓</span>':'<span class="mk n">✗</span>'};
  const prev=S.emailPrev;
  return head('Staff · Asana onboarding board + Paycom + TalentLMS','Documents &amp; Trainings',`${scopeLabel()} · ${missAll.length} of ${all.length} staff are missing at least one item. Due June 14.`)+`
  <section class="panel"><h2>${S.ckGrid?'Everyone at a glance <span class="sub">Synced from the Asana onboarding board, Paycom and TalentLMS 1 hour ago</span>':'Who is missing what <span class="sub">Synced from the Asana onboarding board, Paycom and TalentLMS 1 hour ago</span>'}<span class="seg" role="group" aria-label="Layout"><button data-ckgrid="1" aria-pressed="${S.ckGrid}">Board</button><button data-ckgrid="0" aria-pressed="${!S.ckGrid}">List</button></span></h2>${S.ckGrid?`<div class="seg" role="group" aria-label="Board" style="margin-top:12px"><button data-docmode="docs" aria-pressed="${S.docMode!=='train'}">Documents</button><button data-docmode="train" aria-pressed="${S.docMode==='train'}">Trainings (TalentLMS)</button></div>`:''}${!isMulti()?(()=>{const c=scoped()[0],M=MODEL[c.id],d=directorOf(c);return `<p style="margin:8px 0 0;font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 22px"><span>Camp Director <b style="color:var(--ink)">${esc(d.name)}</b> (${esc(d.email)})</span><span>Supervisor <b style="color:var(--ink)">${esc(M.supervisor)}</b></span><span>HR Slack channel <b style="color:var(--ink)">${esc(M.slack||'not set')}</b></span><span>Filled <b style="color:var(--ink)">${c.hired}/${c.staffNeed}</b></span></p>`})():''}${staffToolbar()}
  ${S.ckGrid?`${docBoard(rows)}`:`<div class="tw"><table><thead><tr>${sth('name','Name')}${isMulti()?sth('camp','Camp'):''}${sth('role','Role')}<th>Documents owed (staff)</th><th>TalentLMS courses</th><th>Our team's steps</th><th>Sizes</th><th>Last reminded</th><th></th></tr></thead><tbody>
  ${rows.map(x=>{const m=staffMissing(x).length;return `<tr><td><button class="linkish" data-staff="${x.id}">${x.first} ${x.last}</button><div class="region">${x.email}</div></td>${isMulti()?`<td>${campById(x.camp).name}</td>`:''}<td>${x.role}</td><td>${missChips(x,'paycom')}<div class="region">Asana: ${esc(x.ob)} · Paperwork: ${paperStat(x)}</div></td><td>${missChips(x,'talent')}</td><td>${missChips(x,'team')}</td><td>${sizeTxt(x)}</td><td class="muted" style="white-space:nowrap">${S.emailed[x.id]?'Today · '+S.emailed[x.id]:x.lastEmail?x.lastEmail+' · email':'—'}</td><td>${m?`<button class="btn" data-emailone="${x.id}">Remind</button>`:''}</td></tr>`}).join('')}
  </tbody></table></div>`}<p class="muted" style="font-size:12.5px;margin:10px 0 0">${rows.length} of ${all.length} staff shown. Use the filters to find everyone missing one item, like I-9 or Water Safety.</p></section>
  <section class="panel"><h2>Completion by item</h2><div class="grid g2" style="margin-top:6px"><div>${PW.map(t=>{const p=all.filter(x=>x.items[t.k]).length/Math.max(1,all.length);return `<div class="check"><div><div class="n">${t.n}</div><div class="s">${t.src}</div></div><div>${mini(p,sev(p,.9,.7))}</div><div class="btnwrap" style="text-align:right"><button class="btn" data-emailgroup="${t.k}">Remind ${all.filter(x=>x.items[t.k]===false).length}</button></div></div>`}).join('')}</div>
   <div>${TR.map(t=>{const pool=all.filter(x=>x.items[t.k]!==null);const p=pool.filter(x=>x.items[t.k]).length/Math.max(1,pool.length);return `<div class="check"><div><div class="n">${t.n}</div><div class="s">${t.cert?'TalentLMS · certificate upload':'TalentLMS course'}${t.lgOnly?' · lifeguards only':''}</div></div><div>${mini(p,sev(p,.9,.7))}</div><div class="btnwrap" style="text-align:right"><button class="btn" data-emailgroup="${t.k}">Remind ${pool.filter(x=>x.items[t.k]===false).length}</button></div></div>`}).join('')}</div></div>
   <div class="eyebrow" style="margin-top:14px">Our team's steps (never sent to staff)</div><div class="grid g2" style="margin-top:4px"><div>${TEAMDOCS.map(t=>{const p=all.filter(x=>x.team[t.k]).length/Math.max(1,all.length);const n=all.filter(x=>!x.team[t.k]).length;return `<div class="check"><div><div class="n">${t.n}</div><div class="s">Recruitment team</div></div><div>${mini(p,sev(p,.9,.7))}</div><div class="btnwrap" style="text-align:right"><button class="btn" data-teamtask="${t.k}">${n} to do</button></div></div>`}).join('')}</div></div>
   <div class="btnrow" style="margin-top:12px;align-items:center"><button class="btn primary" data-emailgroup="all">Remind all ${missAll.length} staff missing items</button><label style="display:flex;gap:6px;align-items:center;font-weight:600;font-size:13px"><input type="checkbox" id="autoRemind" ${S.autoRemind?'checked':''}> Remind automatically every 3 days by text and email until complete</label></div></section>
  ${(()=>{const ex=all.flatMap(x=>expiring(x).map(e=>({x,e}))).sort((a,b)=>a.e.d.localeCompare(b.e.d));return `<section class="panel"><h2>Expires before camp ends <span class="sub">Physical, sexual harassment training and photo ID expiration dates from the Asana board</span></h2>${ex.length?`<div class="tw"><table><thead><tr><th>Name</th>${isMulti()?'<th>Camp</th>':''}<th>Item</th><th>Expires</th><th></th></tr></thead><tbody>${ex.map(({x,e})=>`<tr><td><button class="linkish" data-staff="${x.id}">${x.first} ${x.last}</button></td>${isMulti()?`<td>${campById(x.camp).name}</td>`:''}<td>${e.n}</td><td><b style="color:var(--crit)">${fmtDate(e.d)}</b></td><td><button class="btn" data-emailone="${x.id}">Remind</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted" style="margin:8px 0 0">Nothing expires before the last day of camp.</p>'}</section>`})()}
  ${(()=>{const cs=scoped();const maxW=Math.max(...cs.map(c=>c.nw));const vd=['2027-06-07','2027-06-08','2027-06-09','2027-06-10','2027-06-11','2027-06-14','2027-06-15','2027-06-16','2027-06-17','2027-06-18','2027-06-21','2027-06-22','2027-06-23'];return `<section class="panel"><h2>Our team's recurring checks <span class="sub">Same sections as the Asana onboarding board</span></h2><div class="grid g2" style="margin-top:6px"><div><div class="eyebrow">Weekly SOR checks</div><div class="tw"><table><thead><tr><th>Week</th><th>Due</th><th>Owner</th><th>Status</th></tr></thead><tbody>${[...Array(maxW)].map((_,w)=>`<tr><td>Weekly SOR check · ${dShort(w,0).slice(4)} – ${dShort(w,4).slice(4)}</td><td>${dShort(w,2)}</td><td>Recruitment team</td><td><span class="pill">Scheduled</span></td></tr>`).join('')}</tbody></table></div></div>
   <div><div class="eyebrow">On-site paperwork visits</div><div class="tw"><table><thead><tr><th>Camp</th><th>Visit</th><th>Still owe paperwork</th></tr></thead><tbody>${cs.map(c=>{const owe=STAFF.filter(x=>x.camp===c.id&&paperStat(x)!=='Complete').length;return `<tr><td class="campname">${c.name}</td><td>${fmtDate(vd[CAMPS.indexOf(c)%vd.length])}</td><td>${owe?`<b style="color:var(--warn)">${owe}</b>`:'<span class="ok">0</span>'}</td></tr>`}).join('')}</tbody></table></div></div></div></section>`})()}
`;
}
function emailPanel(prev){const list=prev.ids.map(id=>STAFFBY[id]);const sample=list[0];if(!sample)return '';
  return `<section class="panel" style="border-color:var(--accent)"><h2>Agent email draft <span class="sub">${list.length} recipient${list.length>1?'s':''} · each email lists only that person's missing items</span></h2>
  <div class="email"><div class="hd"><b>To:</b> ${sample.first} ${sample.last} &lt;${sample.email}&gt;${list.length>1?` and ${list.length-1} more`:''}<br><b>Subject:</b> ${sample.first}, a few things left before camp</div>${esc(draftEmail(sample))}</div>
  <div class="btnrow" style="margin-top:10px"><button class="btn primary" data-sendemails="1">Send ${list.length} email${list.length>1?'s':''}</button><button class="btn" data-cancelemail="1">Cancel</button></div></section>`}
function staffProfile(st){const c=campById(st.camp),m=staffMissing(st);
  const row=(t)=>{const v=t.k==='gear'?gearOk(st):st.items[t.k];return `<div class="todo-row"><div><div style="font-weight:600">${t.n}</div><div class="muted" style="font-size:12px">${t.src?t.src+' form':(t.cert?'TalentLMS · certificate upload':'TalentLMS course')}</div></div>${v===null?'<span class="muted">Not required</span>':v?'<span class="ok">✓ Done</span>':'<span class="miss">Missing</span>'}</div>`};
  return `<div><button class="linkish" data-sback2="1">← All staff</button></div>
  <section class="panel"><div class="phead"><div class="avatar" style="background:var(--blue);color:var(--surface)">${st.first[0]}${st.last[0]}</div><div style="min-width:0;flex:1"><h1>${st.first} ${st.last}</h1><div class="badges"><span class="badge">${st.role}</span><span class="badge">${c.name}</span><span class="badge">${wkRange(st)}</span><span class="badge">${st.returning?'Returning staff':'New hire'}</span><span class="badge">${st.id}</span></div></div>
  <div class="btnrow">${m.length?`<button class="btn primary" data-emailone="${st.id}">Remind ${st.first} (text or email)</button>`:'<span class="pill good">Camp-ready</span>'}</div></div></section>
  <div class="grid g2">
   <section class="panel"><h2>Paperwork <span class="sub">Paycom</span></h2><div style="margin-top:6px">${PW.map(row).join('')}</div></section>
   <section class="panel"><h2>Training & certifications <span class="sub">TalentLMS</span></h2><div style="margin-top:6px">${TR.map(row).join('')}</div></section>
   <section class="panel"><h2>Contact & gear</h2><dl class="kv"><dt>Email</dt><dd>${st.email}</dd><dt>Phone</dt><dd>${st.phone}</dd><dt>Camp</dt><dd>${c.name}</dd><dt>Weeks</dt><dd>${wkRange(st)}</dd><dt>Shirt size</dt><dd>${sizeCell(st.gear.shirt)}</dd><dt>Shorts size</dt><dd>${sizeCell(st.gear.shorts)}</dd><dt>Last reminder</dt><dd>${S.emailed[st.id]?'Today · '+S.emailed[st.id]:st.lastEmail?st.lastEmail+' · email':'None yet'}</dd></dl></section>
   <section class="panel"><h2>Time off</h2>${st.off.length?`<div style="margin-top:6px">${st.off.map(o=>{const s2=S.offStatus[st.id+o.w]||o.status;return `<div class="todo-row"><div><div style="font-weight:600">${offTxt(o)} <span class="muted">(Week ${o.w+1})</span></div><div class="muted" style="font-size:12px">${o.reason}</div></div><span class="pill ${s2==='Approved'?'good':s2==='Pending'?'warn':'crit'}">${s2}</span></div>`}).join('')}</div>`:'<p class="muted" style="margin:10px 0 0">No time off requested.</p>'}</section>
  </div>`}
function staffOverview(seg){
  const cs=scoped();const t=k=>sum(cs,c=>c[k]);const need=t('staffNeed');const all=staffScope();
  const steps=[['Applied','Workable',t('applied')],['Offer sent','Workable',t('offered')],['Hired','Paycom',t('hired')],['Cleared','Background + SCR',t('cleared')],['Training done','TalentLMS · 6 courses',t('trained')]];
  const mx=steps[0][2];
  return `<div class="pagehead"><div><div class="eyebrow">Staff · Workable → Paycom → TalentLMS</div><h1>Hiring pipeline</h1><p>${scopeLabel()} · ${need} staff needed for peak week.</p></div></div><div>${seg}</div>
  <section class="panel"><h2>From applicant to camp-ready</h2><div class="funnel">${steps.map(([l,s2,v])=>`<div class="fstep"><div class="fl">${l}<small>${s2}</small></div><div class="fb"><i style="width:${pct(v/mx)}%"></i></div><div class="fv">${fmt(v)}</div></div>`).join('')}
  <div class="fstep"><div class="fl">Still needed<small>to hit peak week</small></div><div class="fb"><i style="width:${pct((need-t('hired'))/mx)}%;background:var(--crit)"></i></div><div class="fv">${need-t('hired')}</div></div></div></section>
  <section class="panel"><h2>By camp</h2><div class="tw"><table><thead><tr><th>Camp</th><th class="num">Needed</th><th class="num">Hired</th><th>Hiring</th><th>Cleared</th><th>Trained</th><th class="num">Missing items</th></tr></thead><tbody>${cs.map(c=>{const mine=all.filter(x=>x.camp===c.id);return `<tr${isMulti()?` class="click" data-camp="${c.id}"`:''}><td class="campname">${c.name}</td><td class="num">${c.staffNeed}</td><td class="num">${c.hired}</td><td>${mini(c.hired/c.staffNeed,sev(c.hired/c.staffNeed,.9,.75))}</td><td>${mini(c.cleared/c.hired,sev(c.cleared/c.hired,.9,.7))}</td><td>${mini(c.trained/c.hired,sev(c.trained/c.hired,.9,.6))}</td><td class="num">${mine.filter(x=>staffMissing(x).length).length} staff</td></tr>`}).join('')}</tbody></table></div></section>`;
}

const PREVIEW='<div class="preview">In-season preview: this is how the page looks during camp. The numbers are sample data for Wed, Jul 14 (Week 3).</div>';
function lineChart(series,labels,o){const W=560,H=o.h||210,pl=40,pr=16,pt=14,pb=28;const y=v=>pt+(H-pt-pb)*(1-(v-o.min)/(o.max-o.min));const x=i=>pl+(W-pl-pr)*(labels.length===1?.5:i/(labels.length-1));
  let g='';o.ticks.forEach(v=>g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${o.fmt(v)}</text>`);
  const every=Math.ceil(labels.length/8);labels.forEach((l,i)=>{if(i%every===0||i===labels.length-1)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${l}</text>`});
  series.forEach(sr=>{g+=`<polyline fill="none" stroke="${sr.color}" stroke-width="2.5" stroke-linejoin="round" points="${sr.values.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`;sr.values.forEach((v,i)=>{const last=i===sr.values.length-1;g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${last?5:3}" fill="${sr.color}" stroke="var(--surface)" stroke-width="${last?2:0}"><title>${sr.name} · ${labels[i]}: ${o.fmt(v)}</title></circle>`;if(last)g+=`<text x="${x(i)-8}" y="${y(v)-10}" text-anchor="end" style="font-weight:700;fill:var(--ink)">${o.fmt(v)}</text>`})});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label}">${g}</svg></div><div class="legend">${series.map(sr=>`<span><i style="background:${sr.color}"></i>${sr.name}</span>`).join('')}</div>`}
function hbars(rows,max,fmtv){return `<div class="hbars">${rows.map(([l,v,col])=>`<div class="hb"><span>${l}</span><div class="t"><i style="width:${pct(v/Math.max(1,max))}%;${col?'background:'+col:''}"></i></div><b>${fmtv?fmtv(v):v}</b></div>`).join('')}</div>`}

function incTrends(all){

  const byLoc=INCLOCS.map(l=>[l,all.filter(x=>x.loc===l).length]).filter(r=>r[1]).sort((a,b)=>b[1]-a[1]);
  const hours=[9,10,11,12,13,14,15,16];const byHour=hours.map(h=>[h>12?(h-12)+' PM':h+(h===12?' PM':' AM'),all.filter(x=>x.hour===h).length]);
  const cs=scoped();const wk=[0,1,2];
  const rate=c=>all.filter(x=>x.camp===c.id).length/c.campers*100;

   ${riser&&riser.b>riser.a?`<div class="alert crit"><div class="sev"></div><div><span class="meta">Rising</span><p>${riser.c.name} went from ${riser.a} incidents in Week 2 to ${riser.b} in Week 3 so far.</p></div></div>`:''}
   <div class="alert info"><div class="sev"></div><div><span class="meta">Most common</span><p>${byType[0][0]} makes up ${pct(byType[0][1]/Math.max(1,all.length))}% of reports. ${byType.find(t=>t[0]==='Behavior')?'Behavior reports are next to review with directors.':''}</p></div></div></div></section>
  <div class="grid g2"><section class="panel"><h2>By type</h2>${hbars(byType,byType[0][1])}</section><section class="panel"><h2>By location</h2>${hbars(byLoc,byLoc[0]?byLoc[0][1]:1)}</section>
  <section class="panel"><h2>By time of day</h2>${hbars(byHour,Math.max(...byHour.map(r=>r[1])),null)}</section>
  <section class="panel"><h2>By week</h2>${hbars(wk.map(w=>['Week '+(w+1)+(w===TODAY.w?' (so far)':''),perWeek[w]]),Math.max(...perWeek))}</section></div>

}

// ----- Budget -----
function viewBudget(){
  const cs=scoped();const cats=cs[0].budget.map(b=>b.n);
  const agg=cats.map((n,i)=>({n,src:cs[0].budget[i].src,bud:sum(cs,c=>c.budget[i].bud),exp:sum(cs,c=>c.budget[i].exp),act:sum(cs,c=>c.budget[i].act)}));
  const T=f=>sum(agg,a=>a[f]);const varPct=a=>(a.act-a.exp)/Math.max(1,a.exp);
  const flags=cs.flatMap(c=>c.budget.map(b=>({c,b,v:(b.act-b.exp)/Math.max(1,b.exp),d:b.act-b.exp}))).filter(x=>x.v>.12&&x.d>500).sort((a,b)=>b.d-a.d).slice(0,3);
  const fc=T('act')/Math.max(1,T('exp'))*T('bud');

function autoGroup(c,w){

    const ks=c.list.filter(k=>k.weeks[w]&&gi(k)===i);if(!ks.length)return;
    const ng=Math.max(1,Math.ceil(ks.length/size)),par={};ks.forEach(k=>par[k.id]=k.id);
    const find=x=>par[x]===x?x:(par[x]=find(par[x]));
    if(S.useFriends)ks.forEach(k=>{if(k.friendId&&par[k.friendId]!==undefined)par[find(k.id)]=find(k.friendId)});
    const units={};ks.forEach(k=>(units[find(k.id)]=units[find(k.id)]||[]).push(k));
    const us=Object.values(units).map(u=>({u,age:u.reduce((a,k)=>a+k.ageM,0)/u.length})).sort((a,b)=>a.age-b.age);
    const target=Math.ceil(ks.length/ng);let gIdx=0,cnt=0;
    us.forEach(({u})=>{if(cnt>0&&cnt+u.length>target&&gIdx<ng-1){gIdx++;cnt=0}u.forEach(k=>S.groups[k.id+'-'+w]=n+(ng>1?' '+String.fromCharCode(65+gIdx):''));cnt+=u.length});
  });

function staffNewView(seg,head){head=head||(()=>'');const ids=scoped().map(c=>c.id);const un=UNPLACED.filter(x=>ids.includes(x.camp)&&x.unplaced);const fresh=STAFF.filter(x=>ids.includes(x.camp)&&/New- Onboarding|Onboarding/.test(x.ob)&&!x.returning);const noIntro=[...un,...fresh].filter(x=>!x.introSent);

function rosterFor(c,w){const out=[];MODEL[c.id].groups.forEach(g=>g.slots.forEach(s=>{if(!s.person)return;const m=slotWeeks(s,c).map;if(!m[w])return;const st=s.staffId?STAFFBY[s.staffId]:null;const note=st?st.off.filter(o=>o.w===w&&(S.offStatus[st.id+o.w]||o.status)!=='Denied').map(offTxt).join(', '):'';out.push({g,s,st,state:m[w],note:note?'out '+note:''})}));return out}

function ucBar(p,cls){return `<div class="t"><i style="width:${pct(p)}%;${cls?"background:var(--"+cls+")":""}"></i></div>`}
const UC_COLS=['First Name','Last Name','Grade (Integer)','Gender Expression','Primary First Name','Primary Last Name','Primary Primary Phone','Primary Email','List - Uncompleted Tasks','Session Balance','Account Balance',"Participant's Release and Hold Harmless Agreement 2026(Status)",'Refund Policy 2026(Status)','Emergency Consent 2026(Status)','Parent Handbook 2026(Status)','Getting to Know You 2026(Status)','Swim Level 2026','Swimming Lessons','AfterCare Days','List - Session Comments','Comment','List - Account Comments','List - Financial Comments','List - Account Private Comments','List - Account Public Comments','List - Person Comments','Allergies','Allergy Description','Friend Request','List - Authorized Pickups','List - Upcoming Reservations Older First'];
const UC_ADD=[['Session Name (or session start date)','Tells Central which week each row is for. Right now each camper has one row per week, but nothing says which week.'],['Person ID (UltraCamp camper ID)','Two different children can share a name. An ID keeps their records apart.'],['Birthdate','Group builder and group sheets sort by age. The report only has grade.'],['Bright Horizons (yes/no) and days attending','Bright Horizons campers choose their days. Without these columns they look like regular campers.'],['Medications','Allergy Description covers allergies, but not daily medications or EpiPens on site.'],['Swim lesson group (A or B)','Swimming Lessons only says yes or no.'],['Authorized pickups with a separator','Names are joined with spaces, so "Asher Parker Elizabeth Williams" can\'t be split reliably. A comma or line break fixes it.']];
function csvParse(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===','){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x!==''))rows.push(row);row=[]}else f+=ch}row.push(f);if(row.some(x=>x!==''))rows.push(row);return rows}
function ucGroup(g){return g===-1?'Pre-K4 Teddies':g===0?'K Gummies':g===1?'1st Hornets':g===2?'2nd Firebirds':g===3?'3rd Cardinals':g===4?'4th Hawks':g>=5&&g<=7?'5th–7th Blue Jays':'Outside camp groups'}
function ucAnalyze(text,name){const all=csvParse(text.replace(/^﻿/,''));if(all.length<2)return {err:'That file has no rows.'};const H=all[0].map(h=>h.trim());const ix=n=>H.indexOf(n);const g=(r,n)=>{const i=ix(n);return i<0?'':(r[i]||'').trim()};
  const rows=all.slice(1);const statusCols=H.filter(h=>/\(Status\)$/.test(h));const sessCol=H.find(h=>/^(session( name)?|session start.*|week)$/i.test(h));
  const map=new Map();rows.forEach(r=>{const key=[g(r,'First Name'),g(r,'Last Name'),g(r,'Primary Email')].join('|').toLowerCase();if(!map.has(key))map.set(key,[]);map.get(key).push(r)});
  const kids=[...map.values()].map(rs=>{const r=rs[0];const gr=parseInt(g(r,'Grade (Integer)'),10);const after=new Set();rs.forEach(x=>g(x,'AfterCare Days').split(',').map(s=>s.trim()).filter(Boolean).forEach(d=>after.add(d)));
    const comments=[...new Set(rs.flatMap(x=>['List - Session Comments','Comment','List - Account Comments','List - Account Public Comments','List - Person Comments'].map(c=>g(x,c))).filter(Boolean).flatMap(c=>c.split(/(?<=only)\s+(?=Please)/)))];
    const forms=statusCols.map(c=>({n:c.replace(/ 2026\(Status\)$/,'').replace(/\(Status\)$/,''),v:g(r,c)||'—'}));
    return {first:g(r,'First Name'),last:g(r,'Last Name'),grade:isNaN(gr)?null:gr,gender:g(r,'Gender Expression'),parent:(g(r,'Primary First Name')+' '+g(r,'Primary Last Name')).trim(),phone:g(r,'Primary Primary Phone'),email:g(r,'Primary Email'),rows:rs.length,
     weeks:sessCol?[...new Set(rs.map(x=>g(x,sessCol)).filter(Boolean))]:null,tasks:g(r,'List - Uncompleted Tasks'),sess:parseFloat(g(r,'Session Balance'))||0,acct:parseFloat(g(r,'Account Balance'))||0,forms,
     swim:g(r,'Swim Level 2026'),lessons:rs.some(x=>g(x,'Swimming Lessons')),after:['Monday','Tuesday','Wednesday','Thursday','Friday'].filter(d=>after.has(d)),allergy:g(r,'Allergies'),adesc:g(r,'Allergy Description'),friend:g(r,'Friend Request'),pickups:[...new Set(rs.map(x=>g(x,'List - Authorized Pickups')).filter(Boolean))],comments}});
  kids.forEach(k=>k.group=k.grade==null?'No grade':ucGroup(k.grade));
  const issues=[];const nameCount={};kids.forEach(k=>{const n=(k.first+' '+k.last).toLowerCase();nameCount[n]=(nameCount[n]||[]).concat(k)});
  if(!sessCol)issues.push(['crit','No session or week column',`Each camper has one row per registration (${rows.length} rows for ${kids.length} campers), but nothing says which week a row is for. Add Session Name to the report.`]);
  const dup=Object.values(nameCount).filter(a=>a.length>1);if(dup.length)issues.push(['warn',`${dup.length} name${dup.length>1?'s are':' is'} shared by different families`,dup.map(a=>`${a[0].first} ${a[0].last} (${a.map(k=>k.parent).join(' and ')})`).join('; ')+'. Add Person ID so they stay separate.']);
  const outG=kids.filter(k=>k.group==='Outside camp groups'||k.group==='No grade');if(outG.length)issues.push(['warn',`${outG.length} camper${outG.length>1?'s':''} outside the camp grade groups`,outG.map(k=>`${k.first} ${k.last} (grade ${k.grade??'blank'})`).join(', ')]);
  const noA=kids.filter(k=>!k.allergy);if(noA.length)issues.push(['warn',`${noA.length} camper${noA.length>1?'s have':' has'} no answer for Allergies`,'Usually the family hasn\'t finished Getting to Know You.']);
  const noteNo=kids.filter(k=>k.allergy==='No'&&k.adesc&&!/^(none|no allergies)\.?$/i.test(k.adesc));if(noteNo.length)issues.push(['blue',`${noteNo.length} said No to allergies but wrote a note`,noteNo.map(k=>`${k.first} ${k.last}: "${k.adesc}"`).join('; ')]);
  const yes=kids.filter(k=>k.allergy==='Yes');
  const noSwim=kids.filter(k=>!k.swim);if(noSwim.length)issues.push(['warn',`${noSwim.length} without a swim level`,'Needed before swim groups are made.']);
  const formOpen=statusCols.map(c=>({c:c.replace(/ 2026\(Status\)$/,''),n:kids.filter(k=>k.forms.find(f=>c.startsWith(f.n))?.v!=='Complete').length}));
  const health=kids.filter(k=>/health form/i.test(k.tasks));
  const bal=kids.filter(k=>k.sess>0||k.acct>0);
  const photo=kids.filter(k=>k.comments.some(c=>/photo|social media/i.test(c)));
  const missingCols=UC_COLS.filter(c=>!H.includes(c));const extraCols=H.filter(c=>!UC_COLS.includes(c));
  return {name,cols:H,rows:rows.length,kids,issues,yes,formOpen,health,bal,photo,sessCol,missingCols,extraCols,
   groups:['Pre-K4 Teddies','K Gummies','1st Hornets','2nd Firebirds','3rd Cardinals','4th Hawks','5th–7th Blue Jays','Outside camp groups'].map(gn=>[gn,kids.filter(k=>k.group===gn).length]).filter(x=>x[1]),
   after:['Monday','Tuesday','Wednesday','Thursday','Friday'].map(d=>[d,kids.filter(k=>k.after.includes(d)).length]),lessons:kids.filter(k=>k.lessons).length}}

    ${A.photo.length?`<div class="eyebrow" style="margin-top:12px">Photo restrictions</div><p style="margin:4px 0 0;font-size:13px">${A.photo.map(k=>k.first+' '+k.last).join(', ')}</p>`:''}</section></div>
  <section class="panel"><h2>Columns to add to the report <span class="sub">So every page in Central can run off this one report</span></h2><div class="tw"><table><thead><tr><th>Add this column</th><th>Why</th></tr></thead><tbody>${UC_ADD.filter(([n])=>!(A.sessCol&&n.startsWith('Session'))).map(([n,w])=>`<tr><td class="campname">${n}</td><td>${w}</td></tr>`).join('')}</tbody></table></div>${A.missingCols.length?`<p class="miss" style="font-size:13px;margin-top:10px">Missing from this file: ${A.missingCols.map(esc).join(', ')}</p>`:''}${A.extraCols.length?`<p class="muted" style="font-size:13px;margin-top:6px">New columns Central will read: ${A.extraCols.map(esc).join(', ')}</p>`:''}</section>

const SA_ST=[['P','Here','good'],['L','Late','warn'],['E','Left early','warn'],['A','Absent · called out','crit'],['N','No call, no show','crit'],['O','Approved day off','']];
const SA_LBL=Object.fromEntries(SA_ST.map(x=>[x[0],x[1]]));
const SAEDIT={};const SASUB={};
function dayKey(w,d){return w+'-'+d}
function isPast(w,d){return w<TODAY.w||(w===TODAY.w&&d<=TODAY.d)}
function shiftOf(role){return /Director/.test(role)?['7:30 AM','5:00 PM']:/Aftercare|Admin/.test(role)?['10:00 AM','6:00 PM']:['8:00 AM','4:00 PM']}
function staffDay(c,w,d){return rosterFor(c,w).filter(r=>r.st).map(r=>{const st=r.st;const off=st.off.find(o=>o.w===w&&o.days.includes(d)&&(S.offStatus[st.id+o.w]||o.status)==='Approved');return {r,st,off:!!off}})}
function staffRec(st,w,d,off){const k=st.id+'|'+dayKey(w,d);if(SAEDIT[k])return SAEDIT[k];const [si,so]=shiftOf(st.role);if(off)return {s:'O',in:'',out:'',note:'Approved time off'};
  if(!isPast(w,d))return null;if(w===TODAY.w&&d===TODAY.d&&!SASUB[st.camp+'|'+dayKey(w,d)]&&hashN(st.id+'pend')<55)return {s:'',in:'',out:'',note:''};
  const h=hashN(st.id+'sa'+w+'x'+d);const s=h<90?'P':h<95?'L':h<97?'E':h<99?'A':'N';
  const mm=hashN(st.id+'m'+w+d)%20+6;const tin=s==='L'?si.replace(':00',':'+String(mm).padStart(2,'0')).replace(':30',':'+String(30+mm%25).padStart(2,'0')):s==='A'||s==='N'?'':si;
  return {s,in:tin,out:s==='E'?['2:15 PM','2:45 PM','3:10 PM'][h%3]:s==='A'||s==='N'?'':so,note:s==='A'?['Sick','Family emergency','Car trouble'][h%3]:s==='E'?'Doctor appointment':''}}
function camperRec(k,w,d){if(!k.days[w]||!k.days[w].includes(d)||!isPast(w,d))return null;if(w===TODAY.w&&d===TODAY.d)return attStatus(k);const h=hashN(k.id+'ca'+w+'x'+d);return h<92?'P':h<97?'A':'L'}

   cols=['Days scheduled','Here','Late','Left early','Called out','No call, no show','Days off','Hours'];rows=rows.map(p=>({name:p.st.first+' '+p.st.last,sub:p.st.role,c:p.c,id:p.st.id,v:[p.n,p.P,p.L,p.E,p.A,p.N,p.O,Math.round(p.h*10)/10],flag:p.N||p.A+p.L>=3}))}
  else{cs.forEach(c=>c.list.forEach(k=>{if(q&&!(k.first+' '+k.last+' '+k.parent).toLowerCase().includes(q))return;let n=0,P=0,L=0,A=0;days.forEach(({w,d})=>{const s=camperRec(k,w,d);if(!s)return;n++;s==='P'?P++:s==='L'?L++:A++;detail.push({c,who:k.first+' '+k.last,role:groupOf(k),w,d,st:s==='P'?'Here':s==='L'?'Late':'Absent',in:'',out:'',note:''})});if(n)rows.push({name:k.first+' '+k.last,sub:groupOf(k),c,kid:k.id,v:[n,P,L,A,Math.round((P+L)/n*100)+'%'],flag:A>=3})}));cols=['Days expected','Here','Late','Absent','Rate']}

  if(e.target.dataset.cassign!==undefined){if(e.target.value)S.cAssign[e.target.dataset.cassign]=e.target.value;else delete S.cAssign[e.target.dataset.cassign];render();toast('Assignment saved')}
  if(e.target.dataset.gk!==undefined){if(e.target.value)S.groups[e.target.dataset.gk]=e.target.value;else delete S.groups[e.target.dataset.gk];toast('Group saved')}
  if(e.target.id==='wkSel'){S.week=+e.target.value;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.rem||S.blkEdit)){S.rem=null;S.blkEdit=null;render()}});
document.addEventListener('input',e=>{if(e.target.id==='rq'){S.rq=e.target.value;render()}if(e.target.id==='cq'){S.cq=e.target.value;render()}if(e.target.id==='mq'){S.mq=e.target.value;render()}if(e.target.id==='sq'){S.sq=e.target.value;render()}if(e.target.id==='ctq'){S.ctq=e.target.value;render()}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset||{};const sd=S.saDay||{w:TODAY.w,d:TODAY.d};
  const cur=k=>{if(SAEDIT[k])return SAEDIT[k];const [id]=k.split('|');const st=STAFFBY[id];const r=staffRec(st,sd.w,sd.d,false)||{s:'',in:'',out:'',note:''};return SAEDIT[k]={...r}};
  if(t.id==='saDaySel'){const [w,dd]=t.value.split('-').map(Number);S.saDay={w,d:dd};render()}
  else if(d.sast){const r=cur(d.sast);r.s=t.value;const st=STAFFBY[d.sast.split('|')[0]];const [i,o]=shiftOf(st.role);if(r.s==='P'){r.in=r.in||i;r.out=r.out||o}if(r.s==='A'||r.s==='N'||r.s==='O'){r.in='';r.out=''}render()}
  else if(d.sain){cur(d.sain).in=t.value}else if(d.saout){cur(d.saout).out=t.value}else if(d.sanote){cur(d.sanote).note=t.value}
  else if(t.id==='repType'){S.rep.type=t.value;render()}else if(t.id==='repFrom'){S.rep.from=t.value;const v=x=>x.split('-').reduce((a,b,i)=>a+(i?+b:+b*10),0);if(v(S.rep.to)<v(t.value))S.rep.to=t.value;render()}else if(t.id==='repTo'){S.rep.to=t.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='repQ'){S.rep.q=e.target.value;const pos=e.target.selectionStart;render();const el=$('#repQ');if(el){el.focus();el.setSelectionRange(pos,pos)}}});
document.addEventListener('submit',e=>{
  if(e.target.id==='noteForm'){e.preventDefault();const id=e.target.dataset.staffid;const t=$('#ntxt').value.trim();if(!t)return;const asana=$('#nasana').checked;(NOTES[id]||(NOTES[id]=[])).unshift({cat:$('#ncat').value,text:t,by:noteAuthor(STAFFBY[id]),date:'Today',asana,mine:true});S.noteFilter='all';render();toast(asana?'Note saved and added to the Asana card':'Note saved');return}
  if(e.target.id==='blkForm'){e.preventDefault();const x=S.blkEdit;const P=prog(campById(x.camp),x.w);const nb={s:$('#bf_s').value.trim(),e:$('#bf_e').value.trim(),a:$('#bf_a').value.trim(),t:$('#bf_t').value};const day=P.days[x.d];const old=x.bi>=0?{...day.groups[x.g][x.bi]}:null;
    const also=[...document.querySelectorAll('input[name=bf_also]:checked')].map(i=>i.value);
    [x.g,...also].forEach(g=>{const tr=day.groups[g]||(day.groups[g]=[]);let idx=g===x.g?x.bi:(old?tr.findIndex(b=>b.s===old.s&&b.a===old.a):-1);if(idx>=0)tr[idx]={...nb};else tr.push({...nb});tr.sort((a,b)=>(pmin(a.s)??9999)-(pmin(b.s)??9999))});S.blkEdit=null;render();toast(also.length?`Saved for ${also.length+1} groups`:'Schedule updated');return}
  if(e.target.id==='incForm'){e.preventDefault();const f=S.newInc;const c=campById(f.camp);const name=$('#nf_kid').value.trim().toLowerCase();const k=c.list.find(x=>(x.first+' '+x.last).toLowerCase()===name);
    if(!k){toast('Pick a camper from the list so the report links to their profile.');return}
    const [w,d]=$('#nf_day').value.split('-').map(Number);const [hh,mm]=$('#nf_time').value.split(':').map(Number);const ty=INCTYPES.find(t=>t.t===$('#nf_type').value);
    const x={id:'INC-'+(INCN+=1),camp:c.id,w,d,hour:hh,time:`${hh>12?hh-12:hh||12}:${String(mm).padStart(2,'0')} ${hh>=12?'PM':'AM'}`,type:ty.t,loc:$('#nf_loc').value,kid:k.id,staff:$('#nf_staff').value,desc:$('#nf_desc').value,fa:$('#nf_fa').value,wit:$('#nf_wit').value,steps:{filed:true,parent:$('#nf_parent').checked,director:false,health:ty.h?false:null,follow:false}};
    INCIDENTS.unshift(x);INCBY[x.id]=x;S.newInc=null;S.incSel=x.id;S.incView='log';render();window.scrollTo(0,0);toast(ty.h?'Report filed. The Camp Director and Health & Safety were notified.':'Report filed. The Camp Director was notified.');return}
  if(e.target.id!=='askform')return;e.preventDefault();const v=$('#askin').value.trim();if(!v)return;
  S.chat.push({me:1,t:esc(v)},{t:'In the live version, I would answer this from UltraCamp, Workable, Paycom, TalentLMS and Asana, limited to the camps you have access to. For this mockup, try one of the sample questions.'});render();
});
render();
</script>
